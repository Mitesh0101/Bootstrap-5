<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 
        form-check-label    =>  changes the display to inline-block
        form-check-input    =>  keeps the checkbox inline, makes the border rounded,
                                and when checked changes the background color to blue with
                                a white arrow inside it. for checkbox
    -->

    <div class="container-fluid my-3">
        <label for="hobby" class="form-label">Hobbies : </label>
        <input type="checkbox" name="hobby" id="sports" class="form-check-input">
        <label for="sports" class="form-check-label">Sports</label>
        <input type="checkbox" name="hobby" id="music" class="form-check-input" checked>
        <label for="music" class="form-check-label">Music</label>
        <input type="checkbox" name="hobby" id="art" class="form-check-input">
        <label for="art" class="form-check-label">Art</label>
        <br>
        <input type="checkbox" name="disabled-checkbox" id="disabled-checked-checkbox" class="form-check-input" disabled checked>
        <label for="disabled-checked-checkbox" class="form-check-label">Disabled Checked Checkbox</label>
        <input type="checkbox" name="disabled-checkbox" id="disabled-checkbox" class="form-check-input" disabled>
        <label for="disabled-checkbox" class="form-check-label">Disabled Checkbox</label>
    </div>

    <!-- 
        form-check-input    =>  Has 50% border-radius. Changes the background and border
                                color to blue when checked for radio button.
    -->
    <div class="container-fluid my-3">
        <label for="gender" class="form-label">Gender : </label>
        <input type="radio" name="gender" id="male" class="form-check-input" checked>
        <label for="male" class="form-check-label">Male</label>
        <input type="radio" name="gender" id="female" class="form-check-input">
        <label for="female" class="form-check-label">Female</label>
        <br> 
        <input type="radio" name="disabled-radio" id="disabled-radio" class="form-check-input" disabled>
        <label for="disabled-radio" class="form-check-label">Disabled Radio</label>
        <input type="radio" name="disabled-checked-radio" id="disabled-checked-radio" class="form-check-input" disabled checked>
        <label for="disabled-checked-radio" class="form-check-label">Disabled Checked Radio</label>
    </div>
    
    <!-- 
        form-check-input    =>      custom checkbox that looks like a switch.
        inside form-switch          increases width to 2em with -2.5em margin left and makes the border
                                    radius 2em. When checked changes the background position to make it
                                    look like its checked
        By default, the checkboxes inside multiple form-check are stacked vertically
        Can use .form-check-inline class on the div wrapper of the checkbox to make the
        checkboxes inside multiple divs stack horizontally
    -->
    <div class="form-check form-switch">
        <input type="checkbox" name="switch" id="switch" class="form-check-input">
        <label for="switch" class="form-check-label">Default Switch</label>
    </div>
    <div class="form-check form-switch">
        <input type="checkbox" name="checked-switch" id="checked-switch" class="form-check-input" checked>
        <label for="checked-switch" class="form-check-label">Checked Switch</label>
    </div>
    <div class="form-check form-switch">
        <input type="checkbox" name="disabled-switch" id="disabled-switch" class="form-check-input" disabled>
        <label for="disabled-switch" class="form-check-label">Disabled Switch</label>
    </div>
    <div class="form-check form-switch mb-5">
        <input type="checkbox" name="disabled-checked-switch" id="disabled-checked-switch" class="form-check-input" disabled checked>
        <label for="disabled-checked-switch" class="form-check-label">Disabled Checked Switch</label>
    </div>

    <!-- 
        btn-check   =>  makes the radio or checkbox button-like by applying
                        btn styles on the labels and btn-check on the input 
    -->
    <div class="container-fluid mb-5">
        <input type="checkbox" class="btn-check" id="btn-check">
        <label class="btn btn-primary" for="btn-check">Single toggle</label>
        <input type="checkbox" class="btn-check" id="btn-check-2" checked>
        <label class="btn btn-primary" for="btn-check-2">Checked</label>
        <input type="checkbox" class="btn-check" id="btn-check-3" disabled>
        <label class="btn btn-primary" for="btn-check-3">Disabled</label>
    </div>

    <div class="container-fluid mb-5">
        <input type="radio" class="btn-check" name="options" id="option1" checked>
        <label class="btn btn-secondary" for="option1">Checked</label>
        <input type="radio" class="btn-check" name="options" id="option2">
        <label class="btn btn-secondary" for="option2">Radio</label>
        <input type="radio" class="btn-check" name="options" id="option3" disabled>
        <label class="btn btn-secondary" for="option3">Disabled</label>
        <input type="radio" class="btn-check" name="options" id="option4">
        <label class="btn btn-secondary" for="option4">Radio</label>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
