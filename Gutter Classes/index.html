<body>
    <!--
        Gutter classes are used to adjust the spacing between the columns.
        There are two gutter classes : gx and gy.
        They can take 5 values.
        gx-0    gy-0    0px
        gx-1    gy-1    4px
        gx-2    gy-2    8px
        gx-3    gy-3    16px
        gx-4    gy-4    24px
        gx-5    gy-5    48px

        gx => Handles the horizontal padding of the columns
        gy => Handles the vertical gap between the columns
    -->
    <div class="container-fluid">
        <div class="row bg-primary mb-3 row-cols-lg-5 row-cols-sm-2 row-cols-1 g-5">
