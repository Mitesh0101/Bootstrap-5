<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 
        Bootstrap Containers Widths for Different Screens:
                            Extra small     Small       Medium      Large       X-Large     XX-Large
                            <576px          ≥576px      ≥768px      ≥992px      ≥1200px     ≥1400px
        .container 	        100% 	        540px 	    720px 	    960px 	    1140px 	    1320px
        .container-sm 	    100% 	        540px 	    720px 	    960px 	    1140px 	    1320px
        .container-md 	    100% 	        100% 	    720px 	    960px 	    1140px 	    1320px
        .container-lg 	    100% 	        100% 	    100% 	    960px 	    1140px 	    1320px
        .container-xl 	    100% 	        100% 	    100% 	    100% 	    1140px 	    1320px
        .container-xxl 	    100% 	        100% 	    100% 	    100% 	    100% 	    1320px
        .container-fluid 	100% 	        100% 	    100% 	    100% 	    100% 	    100%

        Mostly only container and container-fluid classes are used
    -->

    <!-- Takes Specific widths for specific screen sizes -->
    <div class="container bg-primary">Hello</div>

    <!-- Takes 100% width for all screen sizes -->
    <div class="container-fluid bg-danger">Hello</div>

    <!-- Takes 100% width till md screen size i.e. till 767px and takes specific widths for other screen sizes -->
    <div class="container-md bg-info">Hello</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
