<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-3 mx-auto text-white d-flex flex-column gap-1">
        <div class="w-25 bg-dark">Width 25%</div>
        <div class="w-50 bg-dark">Width 50%</div>
        <div class="w-75 bg-dark">Width 75%</div>
        <div class="w-100 bg-dark">Width 100%</div>
        <div class="w-auto bg-dark">Width Auto</div>
    </div>

    <div class="container bg-dark my-3 mx-auto text-white d-flex gap-1" style="height: 100px;">
        <div class="h-25 bg-danger">Height 25%</div>
        <div class="h-50 bg-danger">Height 50%</div>
        <div class="h-75 bg-danger">Height 75%</div>
        <div class="h-100 bg-danger">Height 100%</div>
        <div class="h-auto bg-danger">Height Auto</div>
    </div>

    <div class="container bg-dark my-3 mx-auto text-white">
        <div class="mw-100 bg-danger">Max Width 100%</div>
    </div>

    <div class="container bg-dark my-3 mx-auto text-white" style="height: 100px;">
        <div class="mh-100 bg-danger">Max Height 100%</div>
    </div>

    <div class="container bg-dark my-3 mx-auto text-white" style="height: 100px;">
        <!-- <div class="bg-danger min-vw-100">Min-width 100vw</div>
        <div class="bg-danger vw-100">Width 100vw</div>
        <div class="bg-danger min-vh-100">Min-height 100vh</div>
        <div class="bg-danger vh-100">Height 100vh</div> -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
