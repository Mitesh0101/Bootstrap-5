<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5 mx-auto text-center bg-light shadow-none">No Shadow</div>
    <div class="container my-5 mx-auto text-center bg-light shadow-sm">Small Shadow</div>
    <div class="container my-5 mx-auto text-center bg-light shadow">Regular Shadow</div>
    <div class="container my-5 mx-auto text-center bg-light shadow-lg">Large Shadow</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
