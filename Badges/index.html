<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center my-3">
        <h1>Heading <span class="badge bg-secondary">Badge</span></h1>
        <h2>Heading <span class="badge bg-secondary">Badge</span></h1>
        <h3>Heading <span class="badge bg-secondary">Badge</span></h1>
        <h4>Heading <span class="badge bg-secondary">Badge</span></h1>
        <h5>Heading <span class="badge bg-secondary">Badge</span></h1>
        <h6>Heading <span class="badge bg-secondary">Badge</span></h1>
    </div>

    <div class="container text-center my-3">
        <!-- Badges can be used with buttons to provide a counter -->
        <button class="btn btn-primary">Notifications <span class="badge bg-secondary">5</span></button>
    </div>

    <div class="container text-center my-3">
        <!-- Badges can have various colors like below and we can set text-dark on light colors -->
        <span class="badge bg-primary">Primary</span>
        <span class="badge bg-secondary">Secondary</span>
        <span class="badge bg-success">Success</span>
        <span class="badge bg-danger">Danger</span>
        <span class="badge bg-warning text-dark">Warning</span>
        <span class="badge bg-info text-dark">Info</span>
        <span class="badge bg-light text-dark">Light</span>
        <span class="badge bg-dark">Dark</span>
    </div>

    <div class="container text-center my-3">
        <!-- rounded-pill class can be used to make the badges rounded by increasing the border radius -->
        <span class="badge rounded-pill bg-primary">Primary</span>
        <span class="badge rounded-pill bg-secondary">Secondary</span>
        <span class="badge rounded-pill bg-success">Success</span>
        <span class="badge rounded-pill bg-danger">Danger</span>
        <span class="badge rounded-pill bg-warning text-dark">Warning</span>
        <span class="badge rounded-pill bg-info text-dark">Info</span>
        <span class="badge rounded-pill bg-light text-dark">Light</span>
        <span class="badge rounded-pill bg-dark">Dark</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
