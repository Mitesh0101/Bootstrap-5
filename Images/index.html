<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 
        img-fluid => make an image adjust to the size of the container
        applies width:100% and height:auto to the image
        Can make large images fit to the container but can't make small
        images stretch to fit in the container

        img-thumbnail => gives the image 1px rounded border

        rounded => Gives the image rounded border

        ALIGNING IMAGES INSIDE A CONTAINER
        float-start     =>  Aligns the image to the left of the container
        float-end       =>  Aligns the image to the right of the container
        mx-auto d-block =>  Aligns the image to the center of the container
    -->

    <div class="container-fluid">
        <div class="row my-3 align-items-center">
            <div class="col-12 px-3 text-align-center">
                <img src="https://www.britannica.com/cdn/23/256823-101-11E00D74/images/image-2.jpg" class="img-fluid img-thumbnail float-end" alt="peacock">
            </div>
        </div>
    </div>

    <!-- 
        .figure             =>  Add some baseline styles to figure
        .figure-caption     =>  Add some baseline styles to figurecaption
        .figure-img         =>  Applied to image in figure
    -->

    <div class="container-fluid">
        <figure class="figure w-100">
            <img src="https://www.britannica.com/cdn/23/256823-101-11E00D74/images/image-2.jpg" class="figure-img img-fluid mx-auto d-block rounded" alt="peacock">
            <figcaption class="figure-caption text-center">Peacock</figcaption>
        </figure>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
